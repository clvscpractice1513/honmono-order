<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>團體點餐</title>
<meta name="description" content="看照片點餐，自動計算金額">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<script>
/* ===== 唯一要改的地方：把 Apps Script 部署後的網址貼在引號裡（結尾是 /exec）=====
   菜單、價格、照片檔名都在 Google 試算表的「菜單」工作表修改，不用改這個檔案。 */
const SCRIPT_URL = "";
</script>
<style>
:root{
  --paper:#FFF8F3; --card:#FFFFFF; --ink:#3A2A26; --muted:#8C756D; --line:#F1DCD3;
  --coral:#E8583F; --coral-ink:#FFFFFF; --coral-soft:#FCE6DE; --leaf:#4E9A5B; --warn:#C2410C;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Fredoka","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#1E1715; --card:#2A211E; --ink:#F6E9E3; --muted:#BFA79E; --line:#43342F;
  --coral:#FF7A5F; --coral-ink:#1E1715; --coral-soft:#3D2620; --leaf:#7CC48A; --warn:#FB923C; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:22px 10px}
.brand small{display:block;color:var(--coral);font-weight:700;letter-spacing:.18em;font-size:12px}
.brand h1{margin:2px 0 0;font-size:clamp(22px,4.6vw,32px);font-weight:900;text-wrap:balance;line-height:1.2}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--coral-soft);color:var(--coral)}
.status.closed{background:var(--line);color:var(--muted)}
.demo{margin:8px 0 0;font-size:13px;font-weight:700;color:var(--warn);border:1.5px dashed var(--warn);border-radius:10px;padding:8px 12px}

nav.cats{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none;border-bottom:1px solid var(--line);margin-inline:-4px;padding-inline:4px}
nav.cats::-webkit-scrollbar{display:none}
nav.cats a{flex:none;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px;background:var(--card);border:1.5px solid var(--line)}
.howto{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px;font-size:13.5px;color:var(--muted)}
.howto span{background:var(--card);border:1px dashed var(--line);padding:4px 10px;border-radius:8px}
.howto b{color:var(--coral)}

section.cat{padding-top:18px;scroll-margin-top:60px}
section.cat>h2{display:flex;align-items:baseline;gap:10px;margin:0 0 4px;font-size:22px;font-weight:900}
section.cat>h2 em{font-style:normal;font-family:var(--f-num);color:var(--coral);font-size:13px;letter-spacing:.14em;font-weight:600}
.cat-note{margin:0 0 10px;color:var(--muted);font-size:13px}
h3.sub{margin:16px 0 8px;font-size:14px;color:var(--coral);font-weight:700;display:flex;align-items:center;gap:8px}
h3.sub::after{content:"";flex:1;border-top:2px dotted var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.grid.small{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.dish{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dish.on{border-color:var(--coral);box-shadow:0 0 0 2px var(--coral-soft)}
.dish .ph{aspect-ratio:1;width:100%;border-radius:50%;overflow:hidden;background:var(--coral-soft)}
.grid.small .ph{border-radius:12px}
.dish .ph img{width:100%;height:100%;object-fit:cover;display:block}
.dish .nm{font-weight:700;font-size:14.5px;line-height:1.35;min-height:2.7em}
.dish .tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--coral-soft);color:var(--coral)}
.tag.veg{color:var(--leaf);background:transparent;border:1px solid var(--leaf)}
.dish .row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.price{font-family:var(--f-num);font-weight:700;font-size:19px;color:var(--coral)}
.price::before{content:"$";font-size:13px;margin-right:1px}
.step{display:flex;align-items:center;gap:2px}
.step button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--coral);background:var(--card);color:var(--coral);font-size:19px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0}
.step button.add{background:var(--coral);color:var(--coral-ink)}
.step .q{min-width:22px;text-align:center;font-family:var(--f-num);font-weight:700;font-size:16px}
.big{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.big .step button{width:28px;height:28px;font-size:16px}
.closedmask .step button{opacity:.35;pointer-events:none}

.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);color:var(--paper);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cartbar .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;justify-content:space-between}
.cartbar .sum{display:flex;align-items:baseline;gap:10px;min-width:0}
.cartbar .sum b{font-family:var(--f-num);font-size:26px}
.cartbar .sum span{opacity:.75;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:0;border-radius:999px;padding:11px 22px;font-weight:900;font-size:15px;background:var(--coral);color:var(--coral-ink);flex:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,10,8,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--paper);width:100%;max-width:560px;max-height:92%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.panel h2{margin:0 0 12px;font-size:20px;font-weight:900}
.lines{list-style:none;margin:0 0 12px;padding:0;border-top:1px solid var(--line)}
.lines li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.lines li .x{color:var(--muted);font-family:var(--f-num)}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:16px;margin-bottom:14px}
.total b{font-family:var(--f-num);font-size:26px;color:var(--coral)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:700;font-size:13.5px}
.field label i{font-style:normal;color:var(--coral)}
/* 16px 以上避免 iPhone 點輸入框時自動放大 */
.field input,.field textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.field textarea{min-height:60px;resize:vertical}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.msg{font-size:13.5px;margin:0 0 10px;color:var(--muted)}
.msg.err{color:var(--warn);font-weight:700}
.ok{font-size:44px;line-height:1;color:var(--leaf);font-weight:900}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:420px){.grid,.grid.small{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.dish .nm{font-size:13.5px}.step button{width:32px;height:32px}}
.dish.nophoto .nm{min-height:0;font-size:15.5px}
.state{text-align:center;color:var(--muted);padding:48px 8px;font-size:15px}
.state b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.skel{background:var(--card);border:1.5px solid var(--line);border-radius:16px;height:250px;opacity:.6}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <small id="store">團體點餐</small>
      <h1 id="evTitle">活動便當訂購</h1>
      <p id="evSub">看照片點餐，系統自動計算金額。送出前請確認姓名。</p>
    </div>
    <span class="status" id="status" hidden>開放點餐中</span>
  </header>
  <nav class="cats" id="cats" hidden></nav>
  <div class="howto" id="howto" hidden>
    <span><b>①</b> 按 ＋ 選餐點</span><span><b>②</b> 可加大的餐點有「加大」按鈕</span><span><b>③</b> 按下方「確認訂單」</span><span><b>④</b> 填姓名送出</span>
  </div>
  <main id="menu"><div class="grid" style="padding-top:18px"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></main>
</div>

<div class="cartbar">
  <div class="in">
    <div class="sum"><b class="num" id="cTotal">$0</b><span id="cCount">菜單載入中…</span></div>
    <button class="btn" id="checkout" disabled>確認訂單</button>
  </div>
</div>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Number(n||0).toLocaleString("en-US");
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let ITEMS=[],BY={},cart={},open=true,ready=false;

/* 購物車的 key：品名；加大為「品名~L」 */
const baseOf=k=>k.endsWith("~L")?k.slice(0,-2):k;
const lineName=k=>BY[baseOf(k)].name+(k.endsWith("~L")?"（加大）":"");
const linePrice=k=>BY[baseOf(k)].price+(k.endsWith("~L")?BY[baseOf(k)].ext:0);
const imgSrc=v=>!v?"":/^https?:\/\//i.test(v)?v:"img/"+v;

/* ---------- 由試算表資料畫出菜單 ---------- */
function buildMenu(menu){
  ITEMS=menu;BY={};menu.forEach((it,i)=>{it.i=i;BY[it.name]=it});
  const cats=[];menu.forEach(it=>{let c=cats.find(c=>c.t===it.cat);if(!c)cats.push(c={t:it.cat,items:[]});c.items.push(it)});
  if(!cats.length){$("#menu").innerHTML=`<div class="state"><b>目前沒有可點的餐點</b>請承辦人到試算表「菜單」工作表新增品項並勾選「上架」。</div>`;return}
  $("#cats").innerHTML=cats.map((c,i)=>`<a href="#cat${i}">${esc(c.t)}</a>`).join("");
  $("#cats").hidden=cats.length<2;$("#howto").hidden=false;
  $("#menu").innerHTML=cats.map((c,i)=>{
    const exts=[...new Set(c.items.map(it=>it.ext))];
    const note=exts.length===1&&exts[0]>0?`本類可加大 +$${exts[0]}`:"";
    const subs=[];c.items.forEach(it=>{let s=subs.find(s=>s.s===it.sub);if(!s)subs.push(s={s:it.sub,items:[]});s.items.push(it)});
    return `<section class="cat" id="cat${i}"><h2>${esc(c.t)}</h2>${note?`<p class="cat-note">${note}</p>`:""}
      ${subs.map(s=>`${s.s?`<h3 class="sub">${esc(s.s)}</h3>`:""}<div class="grid">${s.items.map(card).join("")}</div>`).join("")}</section>`}).join("");
}
function stepper(k){return `<div class="step"><button type="button" data-k="${esc(k)}" data-d="-1" aria-label="減少">−</button><span class="q" data-q="${esc(k)}">0</span><button type="button" class="add" data-k="${esc(k)}" data-d="1" aria-label="增加">＋</button></div>`}
function card(it){
  const src=imgSrc(it.img);
  return `<article class="dish${src?"":" nophoto"}" data-n="${esc(it.name)}">${src?`<div class="ph"><img src="${esc(src)}" alt="${esc(it.name)}" loading="lazy" width="240" height="240" onerror="this.parentNode.remove();this.closest('.dish').classList.add('nophoto')"></div>`:""}
   <div class="nm">${esc(it.name)}</div>${it.tags.length?`<div class="tags">${it.tags.map(t=>`<span class="tag${/素/.test(t)?" veg":""}">${esc(t)}</span>`).join("")}</div>`:""}
   <div class="row"><span class="price">${it.price}</span>${stepper(it.name)}</div>
   ${it.ext?`<div class="big"><span>加大 +${it.ext}</span>${stepper(it.name+"~L")}</div>`:""}</article>`;
}
$("#menu").addEventListener("click",e=>{const b=e.target.closest("button[data-k]");if(!b||!open||!ready)return;
  const k=b.dataset.k;cart[k]=Math.max(0,(cart[k]||0)+(+b.dataset.d));if(!cart[k])delete cart[k];refresh()});

function cartLines(){return Object.entries(cart).filter(([k,q])=>q>0&&BY[baseOf(k)]).map(([k,q])=>({k,name:lineName(k),price:linePrice(k),qty:q,sub:linePrice(k)*q}))}
function refresh(){
  if(!ready)return;
  document.querySelectorAll("[data-q]").forEach(el=>{el.textContent=cart[el.dataset.q]||0});
  document.querySelectorAll(".dish").forEach(el=>{const n=el.dataset.n;el.classList.toggle("on",!!(cart[n]||cart[n+"~L"]))});
  const ls=cartLines(),tot=ls.reduce((a,l)=>a+l.sub,0),n=ls.reduce((a,l)=>a+l.qty,0);
  $("#cTotal").textContent=money(tot);
  $("#cCount").textContent=n?`${n} 項：${ls.map(l=>l.name+(l.qty>1?"×"+l.qty:"")).join("、")}`:(open?"尚未選擇餐點":"點餐已截止");
  $("#checkout").disabled=!n||!open;
  store.set("order_cart",cart);
}

/* ---------- 確認與送出 ---------- */
function showSheet(html){$("#panel").innerHTML=html;$("#sheet").hidden=false;$("#panel").scrollTop=0}
function hideSheet(){$("#sheet").hidden=true}
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")hideSheet()});
$("#checkout").onclick=()=>{
  const ls=cartLines(),tot=ls.reduce((a,l)=>a+l.sub,0);
  showSheet(`<h2>確認你的訂單</h2><ul class="lines">${ls.map(l=>`<li><span>${esc(l.name)} <span class="x">× ${l.qty}</span></span><span class="num">${money(l.sub)}</span></li>`).join("")}</ul>
   <div class="total"><span>合計</span><b>${money(tot)}</b></div>
   <div class="field"><label for="fName">姓名 <i>*</i></label><input id="fName" autocomplete="name" value="${esc(store.get("order_name",""))}" placeholder="請填寫真實姓名"></div>
   <div class="field"><label for="fNote">備註（選填）</label><textarea id="fNote" placeholder="例：配料加在哪一份、不要辣"></textarea></div>
   <p class="msg err" id="fErr" hidden></p>
   <div class="actions"><button type="button" class="btn ghost" id="fBack">繼續點餐</button><button type="button" class="btn" id="fSend">送出訂單</button></div>`);
  $("#fBack").onclick=hideSheet;$("#fSend").onclick=send;
};
function showErr(t){const e=$("#fErr");e.textContent=t;e.hidden=false}
async function send(){
  const name=$("#fName").value.trim(),note=$("#fNote").value.trim();
  if(!name){showErr("請填寫姓名，承辦人才知道是誰點的。");$("#fName").focus();return}
  store.set("order_name",name);
  const btn=$("#fSend");btn.disabled=true;btn.textContent="送出中…";
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({name,note,cart}),headers:{"Content-Type":"text/plain;charset=utf-8"}});
    const r=await res.json();
    if(!r.ok)throw new Error(r.error||"送出失敗");
    done({name,lines:r.lines,total:r.total,id:r.id});
  }catch(err){
    btn.disabled=false;btn.textContent="再試一次";
    showErr((err&&err.message&&!/fetch|network|json|load/i.test(err.message))?err.message:"網路連線不穩，訂單還沒送出。請確認網路後再按一次。");
  }
}
function done(r){
  cart={};refresh();
  showSheet(`<div class="ok">✓</div><h2 style="margin-top:8px">訂單已送出</h2>
   <ul class="lines">${r.lines.map(l=>`<li><span>${esc(l.name)} <span class="x">× ${l.qty}</span></span><span class="num">${money(l.price*l.qty)}</span></li>`).join("")}</ul>
   <div class="total"><span>${esc(r.name)} 合計</span><b>${money(r.total)}</b></div>
   <p class="msg">訂單編號 <b class="num">${esc(r.id)}</b>，可截圖留存。</p>
   <div class="actions"><button type="button" class="btn ghost" id="again">再幫別人點一份</button><button type="button" class="btn" id="close">完成</button></div>`);
  $("#again").onclick=()=>{hideSheet();scrollTo({top:0})};$("#close").onclick=hideSheet;
}

/* ---------- 啟動：向試算表讀取設定與菜單 ---------- */
function fail(title,msg){$("#menu").innerHTML=`<div class="state"><b>${title}</b>${msg}</div>`;$("#cCount").textContent="目前無法點餐"}
function start(c){
  if(c.store){$("#store").textContent=c.store;document.title=c.store+"團體點餐"}
  if(c.title){$("#evTitle").textContent=c.title;document.title=c.title}
  if(c.sub)$("#evSub").textContent=c.sub;
  open=c.open!==false;
  $("#status").hidden=false;$("#status").textContent=open?"開放點餐中":"點餐已截止";$("#status").classList.toggle("closed",!open);
  buildMenu(Array.isArray(c.menu)?c.menu:[]);
  $("#menu").classList.toggle("closedmask",!open);
  ready=true;
  const saved=store.get("order_cart",{});for(const k in saved)if(BY[baseOf(k)]&&saved[k]>0&&(!k.endsWith("~L")||BY[baseOf(k)].ext))cart[k]=saved[k];
  refresh();
}
if(!SCRIPT_URL)fail("還沒連接 Google 試算表","請承辦人打開 index.html，把 Apps Script 的網址貼進 SCRIPT_URL 的引號裡。");
else fetch(SCRIPT_URL).then(r=>r.json()).then(start).catch(()=>fail("菜單載入失敗","請確認網路後重新整理頁面。若持續發生，請通知承辦人。"));
</script>
</body>
</html>
